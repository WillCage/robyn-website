<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C3D2BE;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#A7B8A2;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D98A96"/>
      <stop offset="100%" style="stop-color:#C97C86"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A7B8A2"/>
      <stop offset="100%" style="stop-color:#8A9F86"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8A9F86" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)" />

  <!-- Decorative rings -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#A7B8A2" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="#D98A96" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>

  <!-- Abstract body silhouette - person in standing/stretching pose -->
  <g transform="translate(250, 240)" filter="url(#softShadow)">
    <!-- Head -->
    <circle cx="0" cy="-75" r="30" fill="url(#bodyGrad)" />
    <!-- Torso -->
    <path d="M-25,-45 Q-30,10 -20,50 Q-10,70 0,75 Q10,70 20,50 Q30,10 25,-45" fill="url(#bodyGrad)" />
    <!-- Left arm (reaching up) -->
    <path d="M-25,-30 Q-55,-50 -65,-80 Q-68,-90 -60,-95 Q-52,-98 -48,-88 Q-40,-65 -28,-35" fill="url(#bodyGrad)" />
    <!-- Right arm (reaching up) -->
    <path d="M25,-30 Q55,-50 65,-80 Q68,-90 60,-95 Q52,-98 48,-88 Q40,-65 28,-35" fill="url(#bodyGrad)" />
    <!-- Left leg -->
    <path d="M-15,65 Q-25,100 -30,135 Q-32,145 -25,148 Q-18,150 -12,142 Q-5,110 0,70" fill="url(#bodyGrad)" />
    <!-- Right leg -->
    <path d="M15,65 Q25,100 30,135 Q32,145 25,148 Q18,150 12,142 Q5,110 0,70" fill="url(#bodyGrad)" />
  </g>

  <!-- Heart / pulse line -->
  <path d="M320,140 Q330,110 350,120 Q370,130 380,160 Q390,190 400,170" fill="none" stroke="#D98A96" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="350" cy="175" r="4" fill="#D98A96" opacity="0.5"/>

  <!-- Decorative dots -->
  <circle cx="120" cy="130" r="5" fill="#D98A96" opacity="0.3"/>
  <circle cx="380" cy="300" r="8" fill="#A7B8A2" opacity="0.3"/>
  <circle cx="150" cy="350" r="6" fill="#D98A96" opacity="0.25"/>
  <circle cx="370" cy="120" r="4" fill="#8A9F86" opacity="0.3"/>
  <circle cx="130" cy="250" r="3" fill="#D98A96" opacity="0.2"/>

  <!-- Leaf / wellness symbol - top right -->
  <g transform="translate(360, 100)" opacity="0.5">
    <path d="M0,20 Q15,0 30,10 Q25,25 10,30 Q0,28 0,20Z" fill="#A7B8A2"/>
    <path d="M0,20 L30,10" stroke="#8A9F86" stroke-width="1" fill="none"/>
  </g>

  <!-- Leaf - bottom left -->
  <g transform="translate(100, 340) scale(-1, 1)" opacity="0.4">
    <path d="M0,20 Q15,0 30,10 Q25,25 10,30 Q0,28 0,20Z" fill="#D98A96"/>
    <path d="M0,20 L30,10" stroke="#C97C86" stroke-width="1" fill="none"/>
  </g>

  <!-- Small star/sparkle accents -->
  <g transform="translate(170, 100)" opacity="0.4">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2Z" fill="#D98A96"/>
  </g>
  <g transform="translate(330, 360)" opacity="0.3">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5Z" fill="#A7B8A2"/>
  </g>

  <!-- Circular frame around the figure -->
  <circle cx="250" cy="245" r="110" fill="none" stroke="#D98A96" stroke-width="2" opacity="0.2" stroke-dasharray="3 4"/>

  <!-- Bottom wave -->
  <path d="M80,400 Q150,370 250,390 Q350,410 420,380" fill="none" stroke="#A7B8A2" stroke-width="2" opacity="0.3"/>
  <path d="M60,420 Q150,390 250,410 Q350,430 440,400" fill="none" stroke="#D98A96" stroke-width="1.5" opacity="0.2"/>

  <!-- Text: "MOVE" -->
  <text x="250" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="300" letter-spacing="16" fill="#A7B8A2" opacity="0.4">MOVE</text>
</svg>
