<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A7B8A2"/>
      <stop offset="100%" style="stop-color:#8A9F86"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C3D2BE"/>
      <stop offset="100%" style="stop-color:#A7B8A2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="#FAFAF8" rx="16"/>

  <!-- Ground line -->
  <line x1="40" y1="280" x2="560" y2="280" stroke="#E0E2E0" stroke-width="1.5"/>

  <!-- Building / gym -->
  <rect x="100" y="120" width="400" height="160" rx="8" fill="url(#buildingGrad)" opacity="0.15"/>
  <rect x="100" y="120" width="400" height="160" rx="8" fill="none" stroke="#A7B8A2" stroke-width="2"/>

  <!-- Roof accent -->
  <path d="M80,120 L100,90 L500,90 L520,120" fill="none" stroke="#D98A96" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100,120 L500,120" stroke="#D98A96" stroke-width="1" opacity="0.3"/>

  <!-- Windows -->
  <rect x="140" y="145" width="60" height="50" rx="4" fill="url(#windowGrad)" stroke="#8A9F86" stroke-width="1.5"/>
  <rect x="220" y="145" width="60" height="50" rx="4" fill="url(#windowGrad)" stroke="#8A9F86" stroke-width="1.5"/>
  <rect x="300" y="145" width="60" height="50" rx="4" fill="url(#windowGrad)" stroke="#8A9F86" stroke-width="1.5"/>
  <rect x="380" y="145" width="60" height="50" rx="4" fill="url(#windowGrad)" stroke="#8A9F86" stroke-width="1.5"/>

  <!-- Window reflections -->
  <line x1="155" y1="145" x2="155" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="235" y1="145" x2="235" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="315" y1="145" x2="315" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="395" y1="145" x2="395" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

  <!-- Door -->
  <rect x="260" y="200" width="80" height="80" rx="6" fill="#D98A96" opacity="0.2" stroke="#D98A96" stroke-width="2"/>
  <!-- Door handle -->
  <circle cx="328" cy="245" r="3" fill="#D98A96" opacity="0.6"/>

  <!-- Gym equipment silhouettes (inside windows) -->
  <!-- Dumbbell in window 1 -->
  <rect x="152" y="165" width="20" height="5" rx="1.5" fill="#8A9F86" opacity="0.5"/>
  <rect x="148" y="160" width="6" height="15" rx="1" fill="#8A9F86" opacity="0.4"/>
  <rect x="176" y="160" width="6" height="15" rx="1" fill="#8A9F86" opacity="0.4"/>

  <!-- Exercise bike in window 3 -->
  <circle cx="330" cy="170" r="10" fill="none" stroke="#8A9F86" stroke-width="1.5" opacity="0.4"/>
  <line x1="330" y1="180" x2="330" y2="192" stroke="#8A9F86" stroke-width="1.5" opacity="0.4"/>

  <!-- Sign: FIFTH GYM -->
  <rect x="210" y="290" width="180" height="36" rx="6" fill="#8A9F86" opacity="0.15" stroke="#8A9F86" stroke-width="1.5"/>
  <text x="300" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8A9F86" letter-spacing="3">FIFTH GYM</text>

  <!-- Decorative elements -->
  <!-- Heart -->
  <g transform="translate(480, 130)" opacity="0.4">
    <path d="M0,-4 Q0,-10 -5,-10 Q-10,-10 -10,-5 Q-10,-10 -15,-10 Q-20,-10 -20,-4 Q-20,2 0,14 Q20,2 20,-4 Q20,-10 15,-10 Q10,-10 10,-5 Q10,-10 5,-10 Q0,-10 0,-4Z" fill="#D98A96" transform="scale(0.5)"/>
  </g>

  <!-- Pulse line -->
  <path d="M50,160 Q70,160 80,140 Q90,120 100,150 Q110,170 130,140 Q140,125 150,160" fill="none" stroke="#D98A96" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- Small decorative dots -->
  <circle cx="70" cy="250" r="3" fill="#A7B8A2" opacity="0.3"/>
  <circle cx="530" cy="230" r="4" fill="#D98A96" opacity="0.25"/>
  <circle cx="550" cy="100" r="3" fill="#8A9F86" opacity="0.3"/>

  <!-- Stars -->
  <g transform="translate(80, 100)" opacity="0.3">
    <path d="M0,-5 L1.5,-1.5 L5,0 L1.5,1.5 L0,5 L-1.5,1.5 L-5,0 L-1.5,-1.5Z" fill="#D98A96"/>
  </g>
  <g transform="translate(520, 200)" opacity="0.25">
    <path d="M0,-4 L1,-1 L4,0 L1,1 L0,4 L-1,1 L-4,0 L-1,-1Z" fill="#A7B8A2"/>
  </g>

  <!-- Location pin -->
  <g transform="translate(520, 80)">
    <path d="M0,-15 Q-10,-5 -10,5 Q-10,15 0,25 Q10,15 10,5 Q10,-5 0,-15Z" fill="#D98A96" opacity="0.4"/>
    <circle cx="0" cy="3" r="4" fill="#FAFAF8"/>
  </g>
</svg>
