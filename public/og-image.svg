<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A7B8A2"/>
      <stop offset="50%" style="stop-color:#8A9F86"/>
      <stop offset="100%" style="stop-color:#7A8F76"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D98A96"/>
      <stop offset="100%" style="stop-color:#C97C86"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" rx="0"/>

  <!-- Decorative circles -->
  <circle cx="1000" cy="100" r="180" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
  <circle cx="1050" cy="150" r="140" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08" stroke-dasharray="6 8"/>
  <circle cx="950" cy="450" r="120" fill="#ffffff" opacity="0.05"/>

  <!-- Abstract figure silhouette -->
  <g transform="translate(900, 300)" filter="url(#shadow)" opacity="0.3">
    <circle cx="0" cy="-60" r="30" fill="#ffffff"/>
    <path d="M-20,-30 Q-25,20 -20,55 Q-12,75 0,78 Q12,75 20,55 Q25,20 20,-30" fill="#ffffff"/>
    <path d="M-20,-20 Q-45,-40 -55,-70 Q-58,-80 -50,-85 Q-42,-88 -38,-78 Q-30,-55 -22,-25" fill="#ffffff"/>
    <path d="M20,-20 Q45,-40 55,-70 Q58,-80 50,-85 Q42,-88 38,-78 Q30,-55 22,-25" fill="#ffffff"/>
  </g>

  <!-- Heart accent -->
  <g transform="translate(820, 120)" opacity="0.2">
    <path d="M0,-12 Q0,-22 -12,-22 Q-22,-22 -22,-12 Q-22,-22 -32,-22 Q-42,-22 -42,-12 Q-42,0 0,24 Q42,0 42,-12 Q42,-22 32,-22 Q22,-22 22,-12 Q22,-22 12,-22 Q0,-22 0,-12Z" fill="#D98A96" transform="scale(0.6)"/>
  </g>

  <!-- Pulse line -->
  <path d="M650,280 Q680,275 700,285 Q720,295 740,275 Q760,255 780,280 Q800,300 830,270 Q850,250 880,280" fill="none" stroke="#D98A96" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Decorative dots -->
  <circle cx="200" cy="100" r="5" fill="#D98A96" opacity="0.2"/>
  <circle cx="150" cy="400" r="8" fill="#ffffff" opacity="0.1"/>
  <circle cx="300" cy="500" r="6" fill="#D98A96" opacity="0.15"/>
  <circle cx="1100" cy="550" r="4" fill="#ffffff" opacity="0.1"/>

  <!-- Main content area -->
  <rect x="80" y="120" width="620" height="390" rx="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Badge -->
  <rect x="130" y="160" width="200" height="36" rx="18" fill="#D98A96" opacity="0.8"/>
  <text x="230" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Qualified Biokineticist</text>

  <!-- Title -->
  <text x="130" y="260" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Robyn Pinks</text>

  <!-- Subtitle -->
  <text x="130" y="310" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#ffffff" opacity="0.9">Biokineticist &amp; Personal Trainer</text>

  <!-- Description -->
  <text x="130" y="360" font-family="system-ui, sans-serif" font-size="18" fill="#ffffff" opacity="0.75">Moving better, feeling stronger.</text>
  <text x="130" y="390" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" opacity="0.6">Stonehouse, South Africa</text>

  <!-- CTA button -->
  <rect x="130" y="420" width="160" height="50" rx="12" fill="#D98A96" opacity="0.9"/>
  <text x="210" y="451" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Book Now</text>

  <!-- Leaf accents -->
  <g transform="translate(100, 60)" opacity="0.2">
    <path d="M0,15 Q12,0 24,8 Q20,20 8,24 Q0,22 0,15Z" fill="#ffffff"/>
    <path d="M0,15 L24,8" stroke="#ffffff" stroke-width="1" fill="none"/>
  </g>
  <g transform="translate(780, 520)" opacity="0.15">
    <path d="M0,15 Q12,0 24,8 Q20,20 8,24 Q0,22 0,15Z" fill="#D98A96"/>
    <path d="M0,15 L24,8" stroke="#C97C86" stroke-width="1" fill="none"/>
  </g>

  <!-- Sparkle -->
  <g transform="translate(650, 180)" opacity="0.2">
    <path d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5Z" fill="#ffffff"/>
  </g>
</svg>
